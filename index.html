<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- maximum-scale=1 / user-scalable=no: this is a phone app, not a document.
         Without it the iOS webview can be zoomed (a focused field under 16px, a
         double-tap, a stray pinch) and the zoom sticks across every tab, clipping
         the screen and pushing the nav out of reach. Capacitor's WKWebView honors
         it; iOS Safari ignores user-scalable for accessibility, so the web PWA
         still pinch-zooms. Keep form controls at 16px+ regardless. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0A0A0A" />
    <meta name="description" content="Zeroed — close the loop on every set." />

    <!-- PWA -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" href="/icons/favicon-32.png" sizes="32x32" />

    <!-- iOS standalone / Add to Home Screen -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Zeroed" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <title>Zeroed</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Inter 700 is loaded because the mobile type scale sets titles, stat
         values and row headings at 700; without it the browser synthesises a
         fake bold that smears at small sizes on a phone. -->
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
