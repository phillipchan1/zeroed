<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Outer crosshair arms -->
  <line x1="50" y1="9" x2="50" y2="21" stroke="#E8CC0A" stroke-width="3" stroke-linecap="square"/>
  <line x1="50" y1="79" x2="50" y2="91" stroke="#E8CC0A" stroke-width="3" stroke-linecap="square"/>
  <line x1="9" y1="50" x2="21" y2="50" stroke="#E8CC0A" stroke-width="3" stroke-linecap="square"/>
  <line x1="79" y1="50" x2="91" y2="50" stroke="#E8CC0A" stroke-width="3" stroke-linecap="square"/>
  <!-- Main targeting ring -->
  <circle cx="50" cy="50" r="29" fill="none" stroke="#E8CC0A" stroke-width="3"/>
  <!-- Inner precision ticks -->
  <line x1="50" y1="21" x2="50" y2="32" stroke="#E8CC0A" stroke-width="2" stroke-linecap="square"/>
  <line x1="50" y1="68" x2="50" y2="79" stroke="#E8CC0A" stroke-width="2" stroke-linecap="square"/>
  <line x1="21" y1="50" x2="32" y2="50" stroke="#E8CC0A" stroke-width="2" stroke-linecap="square"/>
  <line x1="68" y1="50" x2="79" y2="50" stroke="#E8CC0A" stroke-width="2" stroke-linecap="square"/>
  <!-- Center dot -->
  <circle cx="50" cy="50" r="3.5" fill="#E8CC0A"/>
</svg>
