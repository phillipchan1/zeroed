name: iOS TestFlight

# Builds a signed iOS IPA and uploads to Internal TestFlight.
# Not a web prod deploy and does not submit for App Review / external testers.
# One-time Apple + GitHub secrets setup: docs/ios-releases.md
#
# Mirrors phillipchan1/nuvo `.github/workflows/ios-release.yml`:
#   - push to master + workflow_dispatch
#   - same account-level secret names (ASC API key, team id, distribution cert)
#   - version stamp <major>.<minor>.<commit_count>
#   - scripts/appstore-next-build-number.mjs so a re-run never collides
#   - xcodebuild archive + export (Nuvo wraps this in `tauri ios build`;
#     Zeroed is Capacitor, so the xcodebuild is inlined)
#   - xcrun altool --upload-app
#
# Zeroed differences (intentional):
#   - Capacitor ios/ project, not Tauri src-tauri/gen/apple
#   - no watch / widget targets
#   - skip green when the signing / ASC secrets are missing (Nuvo fails red)
#   - VITE_API_BASE_URL from a repo variable; VITE_SUPABASE_* only when it is empty

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

env:
  CI: true
  IOS_BUNDLE_ID: app.zeroed.app

jobs:
  secrets-ready:
    name: Check TestFlight secrets
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ready: ${{ steps.guard.outputs.ready }}
    steps:
      - name: Require signing and App Store Connect secrets
        id: guard
        env:
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          IOS_CERTIFICATE: ${{ secrets.IOS_CERTIFICATE }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_MOBILE_PROVISION: ${{ secrets.IOS_MOBILE_PROVISION }}
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          missing=()
          [ -n "${APPSTORE_KEY_ID:-}" ] || missing+=("APPSTORE_KEY_ID")
          [ -n "${APPSTORE_ISSUER_ID:-}" ] || missing+=("APPSTORE_ISSUER_ID")
          [ -n "${APPSTORE_PRIVATE_KEY:-}" ] || missing+=("APPSTORE_PRIVATE_KEY")
          [ -n "${APPLE_TEAM_ID:-}" ] || missing+=("APPLE_TEAM_ID")
          [ -n "${IOS_CERTIFICATE:-}" ] || missing+=("IOS_CERTIFICATE")
          [ -n "${IOS_CERTIFICATE_PASSWORD:-}" ] || missing+=("IOS_CERTIFICATE_PASSWORD")
          [ -n "${IOS_MOBILE_PROVISION:-}" ] || missing+=("IOS_MOBILE_PROVISION")
          if [ -z "${VITE_API_BASE_URL:-}" ]; then
            [ -n "${VITE_SUPABASE_URL:-}" ] || missing+=("VITE_SUPABASE_URL")
            [ -n "${VITE_SUPABASE_ANON_KEY:-}" ] || missing+=("VITE_SUPABASE_ANON_KEY")
          fi
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::notice::Skipping iOS TestFlight — missing GitHub Actions secrets: ${missing[*]}."
            echo "Add them under Settings → Secrets and variables → Actions. See docs/ios-releases.md."
            echo "The TestFlight job stays skipped (workflow stays green) until those secrets exist."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "TestFlight secrets are present — continuing."
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

  testflight:
    name: Upload Internal TestFlight
    needs: secrets-ready
    if: needs.secrets-ready.outputs.ready == 'true'
    concurrency:
      group: ios-testflight
      cancel-in-progress: true
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Compute version
        # BUILD_NUMBER is the commit count on this ref, same scheme as Nuvo.
        # github.run_number would drift if a run is cancelled or re-dispatched.
        run: |
          BUILD_NUMBER=$(git rev-list --count HEAD)
          MAJOR_MINOR=$(node -p "require('./package.json').version.split('.').slice(0,2).join('.')")
          VERSION="${MAJOR_MINOR}.${BUILD_NUMBER}"
          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"
          echo "Building iOS version $VERSION (build $BUILD_NUMBER)"

      - name: Configure App Store Connect API key
        env:
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          KEY_DIR="${HOME}/.appstoreconnect/private_keys"
          mkdir -p "$KEY_DIR"
          KEY_PATH="${KEY_DIR}/AuthKey_${APPSTORE_KEY_ID}.p8"
          echo "$APPSTORE_PRIVATE_KEY" | base64 --decode > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          echo "APPLE_API_KEY=${APPSTORE_KEY_ID}" >> "$GITHUB_ENV"
          echo "APPLE_API_ISSUER=${APPSTORE_ISSUER_ID}" >> "$GITHUB_ENV"
          echo "APPLE_API_KEY_PATH=${KEY_PATH}" >> "$GITHUB_ENV"

      - name: Resolve build number against App Store Connect
        run: |
          set -euo pipefail
          RESOLVED=$(node scripts/appstore-next-build-number.mjs \
            --bundle-id "$IOS_BUNDLE_ID" \
            --version "$APP_VERSION" \
            --proposed "$BUILD_NUMBER" \
            --key-id "$APPLE_API_KEY" \
            --issuer-id "$APPLE_API_ISSUER" \
            --key-path "$APPLE_API_KEY_PATH")
          echo "BUILD_NUMBER=$RESOLVED" >> "$GITHUB_ENV"
          echo "Resolved iOS build number: $RESOLVED"

      - name: Build web assets and sync Capacitor iOS
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          if [ -n "${VITE_API_BASE_URL:-}" ]; then
            echo "VITE_API_BASE_URL is set (${VITE_API_BASE_URL}) — Worker API. Not baking VITE_SUPABASE_*."
            unset VITE_SUPABASE_URL VITE_SUPABASE_ANON_KEY
          else
            echo "VITE_API_BASE_URL is empty — pre-cutover Supabase client (VITE_SUPABASE_*)."
          fi
          npm run build
          npx cap sync ios

      - name: Import signing certificate
        env:
          APPLE_DEVELOPMENT_TEAM: ${{ secrets.APPLE_TEAM_ID }}
          IOS_CERTIFICATE: ${{ secrets.IOS_CERTIFICATE }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_MOBILE_PROVISION: ${{ secrets.IOS_MOBILE_PROVISION }}
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/zeroed-signing.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -base64 24)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          CERT_PATH="$RUNNER_TEMP/dist.p12"
          echo "$IOS_CERTIFICATE" | base64 --decode > "$CERT_PATH"
          security import "$CERT_PATH" -k "$KEYCHAIN_PATH" -P "$IOS_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security -T /usr/bin/xcodebuild
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          EXISTING_KEYCHAINS=$(security list-keychains -d user | tr -d '"')
          # shellcheck disable=SC2086
          security list-keychains -d user -s "$KEYCHAIN_PATH" $EXISTING_KEYCHAINS

          PROFILE_PATH="$RUNNER_TEMP/zeroed.mobileprovision"
          echo "$IOS_MOBILE_PROVISION" | base64 --decode > "$PROFILE_PATH"
          PROFILES_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILES_DIR"
          PROFILE_PLIST="$RUNNER_TEMP/profile.plist"
          security cms -D -i "$PROFILE_PATH" > "$PROFILE_PLIST"
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$PROFILE_PLIST")
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c 'Print :Name' "$PROFILE_PLIST")
          cp "$PROFILE_PATH" "$PROFILES_DIR/${PROFILE_UUID}.mobileprovision"

          echo "SIGNING_STYLE=manual" >> "$GITHUB_ENV"
          echo "IOS_PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"
          echo "Using manual signing (IOS_CERTIFICATE + provisioning profile '$PROFILE_NAME')."

      - name: Build signed IPA
        env:
          APPLE_DEVELOPMENT_TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          ARCHIVE_PATH="$RUNNER_TEMP/Zeroed.xcarchive"
          EXPORT_PATH="$RUNNER_TEMP/Zeroed-export"
          EXPORT_PLIST="$RUNNER_TEMP/ExportOptions.plist"
          bash scripts/ios-write-export-options.sh "$EXPORT_PLIST"

          cd ios/App
          COMMON=(
            -workspace App.xcworkspace
            -scheme App
            -configuration Release
            -destination 'generic/platform=iOS'
            MARKETING_VERSION="$APP_VERSION"
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER"
            DEVELOPMENT_TEAM="$APPLE_DEVELOPMENT_TEAM"
            PRODUCT_BUNDLE_IDENTIFIER="$IOS_BUNDLE_ID"
          )

          xcodebuild archive \
            "${COMMON[@]}" \
            -archivePath "$ARCHIVE_PATH" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$IOS_PROFILE_NAME"
          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportPath "$EXPORT_PATH" \
            -exportOptionsPlist "$EXPORT_PLIST"

          IPA=$(find "$EXPORT_PATH" -name '*.ipa' -print | head -1)
          if [ -z "$IPA" ]; then
            echo "::error::No IPA found under $EXPORT_PATH"
            ls -la "$EXPORT_PATH" || true
            exit 1
          fi
          echo "IPA_PATH=$IPA" >> "$GITHUB_ENV"
          echo "Archived $IPA"

      - name: Upload to Internal TestFlight
        env:
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
        run: |
          set -euo pipefail
          echo "Uploading $IPA_PATH (v${APP_VERSION}, build ${BUILD_NUMBER}) to Internal TestFlight"
          xcrun altool --upload-app \
            --type ios \
            --file "$IPA_PATH" \
            --apiKey "$APPSTORE_KEY_ID" \
            --apiIssuer "$APPSTORE_ISSUER_ID"
          echo "Upload queued. Assign the build to an Internal Testing group in App Store Connect — do not submit for App Review."
