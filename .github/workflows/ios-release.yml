name: iOS TestFlight

# Builds a signed iOS IPA and uploads to Internal TestFlight.
# Not a web prod deploy and does not submit for App Review / external testers.
# One-time Apple + GitHub secrets setup: docs/ios-releases.md
#
# Signing is automatic + cloud-managed via an App Store Connect API key
# (no .p12, no hand-made provisioning profile):
#   xcodebuild archive / -exportArchive
#     -allowProvisioningUpdates
#     -authenticationKeyPath / -authenticationKeyID / -authenticationKeyIssuerID
#
# Also:
#   - push to master + workflow_dispatch
#   - version stamp <major>.<minor>.<commit_count>
#   - scripts/appstore-next-build-number.mjs so a re-run never collides
#   - skip green when the ASC secrets are missing
#   - VITE_API_BASE_URL from a repo variable; VITE_SUPABASE_* only when it is empty

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

env:
  CI: true
  IOS_BUNDLE_ID: app.zeroed.app

jobs:
  secrets-ready:
    name: Check TestFlight secrets
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ready: ${{ steps.guard.outputs.ready }}
    steps:
      - name: Require App Store Connect API key secrets
        id: guard
        env:
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          missing=()
          [ -n "${ASC_API_KEY_ID:-}" ] || missing+=("ASC_API_KEY_ID")
          [ -n "${ASC_API_ISSUER_ID:-}" ] || missing+=("ASC_API_ISSUER_ID")
          [ -n "${ASC_API_KEY_P8:-}" ] || missing+=("ASC_API_KEY_P8")
          [ -n "${APPLE_TEAM_ID:-}" ] || missing+=("APPLE_TEAM_ID")
          if [ -z "${VITE_API_BASE_URL:-}" ]; then
            [ -n "${VITE_SUPABASE_URL:-}" ] || missing+=("VITE_SUPABASE_URL")
            [ -n "${VITE_SUPABASE_ANON_KEY:-}" ] || missing+=("VITE_SUPABASE_ANON_KEY")
          fi
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::notice::Skipping iOS TestFlight — missing GitHub Actions secrets: ${missing[*]}."
            echo "Add them under Settings → Secrets and variables → Actions. See docs/ios-releases.md."
            echo "The TestFlight job stays skipped (workflow stays green) until those secrets exist."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "TestFlight secrets are present — continuing."
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

  testflight:
    name: Upload Internal TestFlight
    needs: secrets-ready
    if: needs.secrets-ready.outputs.ready == 'true'
    concurrency:
      group: ios-testflight
      cancel-in-progress: true
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Compute version
        # BUILD_NUMBER is the commit count on this ref, same scheme as Nuvo.
        # github.run_number would drift if a run is cancelled or re-dispatched.
        run: |
          BUILD_NUMBER=$(git rev-list --count HEAD)
          MAJOR_MINOR=$(node -p "require('./package.json').version.split('.').slice(0,2).join('.')")
          VERSION="${MAJOR_MINOR}.${BUILD_NUMBER}"
          {
            echo "APP_VERSION=$VERSION"
            echo "BUILD_NUMBER=$BUILD_NUMBER"
          } >> "$GITHUB_ENV"
          echo "Building iOS version $VERSION (build $BUILD_NUMBER)"

      - name: Write App Store Connect API key
        env:
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
        run: |
          set -euo pipefail
          KEY_PATH="${RUNNER_TEMP}/AuthKey_${ASC_API_KEY_ID}.p8"
          if printf '%s' "$ASC_API_KEY_P8" | grep -q -- '-----BEGIN'; then
            printf '%s\n' "$ASC_API_KEY_P8" > "$KEY_PATH"
          else
            printf '%s' "$ASC_API_KEY_P8" | base64 --decode > "$KEY_PATH"
            if ! grep -q -- '-----BEGIN' "$KEY_PATH"; then
              echo "::error::ASC_API_KEY_P8 is neither a PEM .p8 nor valid base64 of one."
              exit 1
            fi
          fi
          chmod 600 "$KEY_PATH"
          # altool looks up AuthKey_<id>.p8 under ~/.appstoreconnect/private_keys
          ALTOOL_DIR="${HOME}/.appstoreconnect/private_keys"
          mkdir -p "$ALTOOL_DIR"
          cp "$KEY_PATH" "${ALTOOL_DIR}/AuthKey_${ASC_API_KEY_ID}.p8"
          chmod 600 "${ALTOOL_DIR}/AuthKey_${ASC_API_KEY_ID}.p8"
          {
            echo "APPLE_API_KEY=${ASC_API_KEY_ID}"
            echo "APPLE_API_ISSUER=${ASC_API_ISSUER_ID}"
            echo "APPLE_API_KEY_PATH=${KEY_PATH}"
            echo "APPLE_API_KEY_ALTOOL_PATH=${ALTOOL_DIR}/AuthKey_${ASC_API_KEY_ID}.p8"
          } >> "$GITHUB_ENV"

      - name: Resolve build number against App Store Connect
        run: |
          set -euo pipefail
          RESOLVED=$(node scripts/appstore-next-build-number.mjs \
            --bundle-id "$IOS_BUNDLE_ID" \
            --version "$APP_VERSION" \
            --proposed "$BUILD_NUMBER" \
            --key-id "$APPLE_API_KEY" \
            --issuer-id "$APPLE_API_ISSUER" \
            --key-path "$APPLE_API_KEY_PATH")
          echo "BUILD_NUMBER=$RESOLVED" >> "$GITHUB_ENV"
          echo "Resolved iOS build number: $RESOLVED"

      - name: Build web assets and sync Capacitor iOS
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          if [ -n "${VITE_API_BASE_URL:-}" ]; then
            echo "VITE_API_BASE_URL is set (${VITE_API_BASE_URL}) — Worker API. Not baking VITE_SUPABASE_*."
            unset VITE_SUPABASE_URL VITE_SUPABASE_ANON_KEY
          else
            echo "VITE_API_BASE_URL is empty — pre-cutover Supabase client (VITE_SUPABASE_*)."
          fi
          npm run build
          npx cap sync ios

      - name: Build signed IPA
        env:
          APPLE_DEVELOPMENT_TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          ARCHIVE_PATH="$RUNNER_TEMP/Zeroed.xcarchive"
          EXPORT_PATH="$RUNNER_TEMP/Zeroed-export"
          EXPORT_PLIST="$RUNNER_TEMP/ExportOptions.plist"
          SIGNING_STYLE=automatic bash scripts/ios-write-export-options.sh "$EXPORT_PLIST"

          cd ios/App
          AUTH=(
            -allowProvisioningUpdates
            -authenticationKeyPath "$APPLE_API_KEY_PATH"
            -authenticationKeyID "$APPLE_API_KEY"
            -authenticationKeyIssuerID "$APPLE_API_ISSUER"
          )
          COMMON=(
            -workspace App.xcworkspace
            -scheme App
            -configuration Release
            -destination 'generic/platform=iOS'
            MARKETING_VERSION="$APP_VERSION"
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER"
            DEVELOPMENT_TEAM="$APPLE_DEVELOPMENT_TEAM"
            PRODUCT_BUNDLE_IDENTIFIER="$IOS_BUNDLE_ID"
            CODE_SIGN_STYLE=Automatic
          )

          xcodebuild archive \
            "${COMMON[@]}" \
            "${AUTH[@]}" \
            -archivePath "$ARCHIVE_PATH"
          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportPath "$EXPORT_PATH" \
            -exportOptionsPlist "$EXPORT_PLIST" \
            "${AUTH[@]}"

          IPA=$(find "$EXPORT_PATH" -name '*.ipa' -print | head -1)
          if [ -z "$IPA" ]; then
            echo "::error::No IPA found under $EXPORT_PATH"
            ls -la "$EXPORT_PATH" || true
            exit 1
          fi
          echo "IPA_PATH=$IPA" >> "$GITHUB_ENV"
          echo "Archived $IPA"

      - name: Upload to Internal TestFlight
        env:
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          echo "Uploading $IPA_PATH (v${APP_VERSION}, build ${BUILD_NUMBER}) to Internal TestFlight"
          xcrun altool --upload-app \
            --type ios \
            --file "$IPA_PATH" \
            --apiKey "$ASC_API_KEY_ID" \
            --apiIssuer "$ASC_API_ISSUER_ID"
          echo "Upload queued. Assign the build to an Internal Testing group in App Store Connect — do not submit for App Review."

      - name: Delete App Store Connect API key
        if: always()
        run: |
          set -euo pipefail
          rm -f "${APPLE_API_KEY_PATH:-}" "${APPLE_API_KEY_ALTOOL_PATH:-}"
          echo "Removed App Store Connect API key files."
