name: iOS TestFlight

# Builds a signed iOS IPA and uploads to Internal TestFlight.
# Not a web prod deploy and does not submit for App Review / external testers.
# One-time Apple + GitHub secrets setup: docs/ios-releases.md
#
# Signing is manual Apple Distribution. The runner imports a .p12 and an
# App Store provisioning profile into a temporary keychain, then writes
# CODE_SIGN_STYLE=Manual / identity / profile / team onto the App target
# only (scripts/ios-apply-app-signing.mjs) before archive. Do not pass
# those as xcodebuild SETTING=value flags — they apply to every target,
# including CocoaPods (CODE_SIGNING_ALLOWED=NO, org.cocoapods.* ids).
# This workflow must never create or revoke certificates — do not pass
# allowProvisioningUpdates, and do not call the App Store Connect
# certificates API.
#   xcodebuild archive  (App target already has Manual Distribution)
#   xcodebuild -exportArchive
#     method=app-store, signingStyle=manual
#
# Also:
#   - push to master + workflow_dispatch
#   - version stamp <major>.<minor>.<commit_count>
#   - scripts/appstore-next-build-number.mjs so a re-run never collides
#   - fail clearly when the signing / ASC secrets are missing
#   - VITE_API_BASE_URL from a repo variable; VITE_SUPABASE_* only when it is empty
#   - .p8 written with umask 077 after cap sync, deleted via a fixed path/glob
#   - signing keychain deleted in an always() step

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

env:
  CI: true
  IOS_BUNDLE_ID: app.zeroed.app

jobs:
  secrets-ready:
    name: Check TestFlight secrets
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require TestFlight and Distribution signing secrets
        env:
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          IOS_DIST_CERT_P12_BASE64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          IOS_APPSTORE_PROFILE_BASE64: ${{ secrets.IOS_APPSTORE_PROFILE_BASE64 }}
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          missing=()
          [ -n "${ASC_API_KEY_ID:-}" ] || missing+=("ASC_API_KEY_ID")
          [ -n "${ASC_API_ISSUER_ID:-}" ] || missing+=("ASC_API_ISSUER_ID")
          [ -n "${ASC_API_KEY_P8:-}" ] || missing+=("ASC_API_KEY_P8")
          [ -n "${APPLE_TEAM_ID:-}" ] || missing+=("APPLE_TEAM_ID")
          [ -n "${IOS_DIST_CERT_P12_BASE64:-}" ] || missing+=("IOS_DIST_CERT_P12_BASE64")
          [ -n "${IOS_DIST_CERT_PASSWORD:-}" ] || missing+=("IOS_DIST_CERT_PASSWORD")
          [ -n "${IOS_APPSTORE_PROFILE_BASE64:-}" ] || missing+=("IOS_APPSTORE_PROFILE_BASE64")
          if [ -z "${VITE_API_BASE_URL:-}" ]; then
            [ -n "${VITE_SUPABASE_URL:-}" ] || missing+=("VITE_SUPABASE_URL")
            [ -n "${VITE_SUPABASE_ANON_KEY:-}" ] || missing+=("VITE_SUPABASE_ANON_KEY")
          fi
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Missing GitHub Actions secrets required for iOS TestFlight: ${missing[*]}."
            echo "Add them under Settings → Secrets and variables → Actions. See docs/ios-releases.md."
            echo "The workflow will not create or revoke Apple certificates, and there is no automatic-signing fallback."
            exit 1
          fi
          echo "TestFlight secrets are present — continuing."

  testflight:
    name: Upload Internal TestFlight
    needs: secrets-ready
    concurrency:
      group: ios-testflight
      cancel-in-progress: false
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Compute version
        # BUILD_NUMBER is the commit count on this ref, same scheme as Nuvo.
        # github.run_number would drift if a run is cancelled or re-dispatched.
        run: |
          BUILD_NUMBER=$(git rev-list --count HEAD)
          MAJOR_MINOR=$(node -p "require('./package.json').version.split('.').slice(0,2).join('.')")
          VERSION="${MAJOR_MINOR}.${BUILD_NUMBER}"
          {
            echo "APP_VERSION=$VERSION"
            echo "BUILD_NUMBER=$BUILD_NUMBER"
          } >> "$GITHUB_ENV"
          echo "Building iOS version $VERSION (build $BUILD_NUMBER)"

      - name: Build web assets and sync Capacitor iOS
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          # arc_load_v1's build ceiling. Unset = off for everyone; "1" lets an
          # athlete's own athlete.flags turn it on (src/lib/flags.ts).
          VITE_ARC_LOAD_V1: ${{ vars.VITE_ARC_LOAD_V1 }}
        run: |
          set -euo pipefail
          if [ -n "${VITE_API_BASE_URL:-}" ]; then
            if [[ "${VITE_API_BASE_URL}" != http://* && "${VITE_API_BASE_URL}" != https://* ]]; then
              echo "::error::iOS VITE_API_BASE_URL must be absolute (https://<worker>/api). Relative /api cannot reach the Worker from Capacitor."
              exit 1
            fi
            echo "VITE_API_BASE_URL is set (${VITE_API_BASE_URL}) — Worker API. Not baking VITE_SUPABASE_*."
            unset VITE_SUPABASE_URL VITE_SUPABASE_ANON_KEY
          else
            echo "VITE_API_BASE_URL is empty — pre-cutover Supabase client (VITE_SUPABASE_*)."
          fi
          npm run build
          npx cap sync ios

      - name: Write App Store Connect API key
        env:
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
        run: |
          set -euo pipefail
          umask 077
          KEY_PATH="${{ runner.temp }}/zeroed-asc.p8"
          ALTOOL_DIR="${HOME}/.appstoreconnect/private_keys"
          mkdir -p "$ALTOOL_DIR"
          if printf '%s' "$ASC_API_KEY_P8" | grep -q -- '-----BEGIN'; then
            printf '%s\n' "$ASC_API_KEY_P8" > "$KEY_PATH"
          else
            printf '%s' "$ASC_API_KEY_P8" | base64 --decode > "$KEY_PATH"
            if ! grep -q -- '-----BEGIN' "$KEY_PATH"; then
              echo "::error::ASC_API_KEY_P8 is neither a PEM .p8 nor valid base64 of one."
              exit 1
            fi
          fi
          # altool looks up AuthKey_<id>.p8 under ~/.appstoreconnect/private_keys
          cp "$KEY_PATH" "${ALTOOL_DIR}/AuthKey_${ASC_API_KEY_ID}.p8"
          {
            echo "APPLE_API_KEY=${ASC_API_KEY_ID}"
            echo "APPLE_API_ISSUER=${ASC_API_ISSUER_ID}"
            echo "APPLE_API_KEY_PATH=${KEY_PATH}"
          } >> "$GITHUB_ENV"

      - name: Resolve build number against App Store Connect
        run: |
          set -euo pipefail
          RESOLVED=$(node scripts/appstore-next-build-number.mjs \
            --bundle-id "$IOS_BUNDLE_ID" \
            --version "$APP_VERSION" \
            --proposed "$BUILD_NUMBER" \
            --key-id "$APPLE_API_KEY" \
            --issuer-id "$APPLE_API_ISSUER" \
            --key-path "${{ runner.temp }}/zeroed-asc.p8")
          echo "BUILD_NUMBER=$RESOLVED" >> "$GITHUB_ENV"
          echo "Resolved iOS build number: $RESOLVED"

      - name: Import Distribution certificate and App Store profile
        env:
          IOS_DIST_CERT_P12_BASE64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          IOS_APPSTORE_PROFILE_BASE64: ${{ secrets.IOS_APPSTORE_PROFILE_BASE64 }}
          APPLE_DEVELOPMENT_TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          missing=()
          [ -n "${IOS_DIST_CERT_P12_BASE64:-}" ] || missing+=("IOS_DIST_CERT_P12_BASE64")
          [ -n "${IOS_DIST_CERT_PASSWORD:-}" ] || missing+=("IOS_DIST_CERT_PASSWORD")
          [ -n "${IOS_APPSTORE_PROFILE_BASE64:-}" ] || missing+=("IOS_APPSTORE_PROFILE_BASE64")
          [ -n "${APPLE_DEVELOPMENT_TEAM:-}" ] || missing+=("APPLE_TEAM_ID")
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Missing GitHub Actions secrets required for manual Distribution signing: ${missing[*]}."
            echo "See docs/ios-releases.md. The workflow will not create or revoke certificates."
            exit 1
          fi

          umask 077
          KEYCHAIN_PATH="${RUNNER_TEMP}/zeroed-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"
          P12_PATH="${RUNNER_TEMP}/zeroed-dist.p12"
          PROFILE_PATH="${RUNNER_TEMP}/zeroed-appstore.mobileprovision"
          PROFILE_PLIST="${RUNNER_TEMP}/zeroed-profile.plist"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db
          security default-keychain -d user -s "$KEYCHAIN_PATH"

          printf '%s' "$IOS_DIST_CERT_P12_BASE64" | base64 --decode > "$P12_PATH"
          if [ ! -s "$P12_PATH" ]; then
            echo "::error::IOS_DIST_CERT_P12_BASE64 did not decode to a .p12 file."
            exit 1
          fi
          security import "$P12_PATH" \
            -k "$KEYCHAIN_PATH" \
            -P "$IOS_DIST_CERT_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security \
            -T /usr/bin/xcodebuild \
            -A
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH" >/dev/null

          IDENTITIES="$(security find-identity -v -p codesigning "$KEYCHAIN_PATH")"
          echo "$IDENTITIES"
          if ! printf '%s\n' "$IDENTITIES" | grep -q 'Apple Distribution'; then
            echo "::error::Imported .p12 does not contain an Apple Distribution identity. Export an Apple Distribution certificate, not Apple Development."
            exit 1
          fi

          printf '%s' "$IOS_APPSTORE_PROFILE_BASE64" | base64 --decode > "$PROFILE_PATH"
          if [ ! -s "$PROFILE_PATH" ]; then
            echo "::error::IOS_APPSTORE_PROFILE_BASE64 did not decode to a provisioning profile."
            exit 1
          fi
          security cms -D -i "$PROFILE_PATH" > "$PROFILE_PLIST"
          PROFILE_UUID="$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$PROFILE_PLIST")"
          PROFILE_NAME="$(/usr/libexec/PlistBuddy -c 'Print :Name' "$PROFILE_PLIST")"
          PROFILE_TEAM="$(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' "$PROFILE_PLIST")"
          if [ "$PROFILE_TEAM" != "$APPLE_DEVELOPMENT_TEAM" ]; then
            echo "::error::Provisioning profile team ${PROFILE_TEAM} does not match APPLE_TEAM_ID ${APPLE_DEVELOPMENT_TEAM}."
            exit 1
          fi
          if /usr/libexec/PlistBuddy -c 'Print :ProvisionedDevices' "$PROFILE_PLIST" >/dev/null 2>&1; then
            echo "::error::IOS_APPSTORE_PROFILE_BASE64 looks like a development or ad-hoc profile (has ProvisionedDevices). Use an App Store profile."
            exit 1
          fi

          PP_DIR="${HOME}/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PP_DIR"
          cp "$PROFILE_PATH" "${PP_DIR}/${PROFILE_UUID}.mobileprovision"

          {
            echo "APPLE_DEVELOPMENT_TEAM=${APPLE_DEVELOPMENT_TEAM}"
            echo "PROVISIONING_PROFILE_SPECIFIER=${PROFILE_NAME}"
            echo "IOS_PROFILE_UUID=${PROFILE_UUID}"
          } >> "$GITHUB_ENV"
          echo "Imported Apple Distribution certificate and App Store profile '${PROFILE_NAME}' (${PROFILE_UUID})."

      - name: Build signed IPA
        run: |
          set -euo pipefail
          ARCHIVE_PATH="$RUNNER_TEMP/Zeroed.xcarchive"
          EXPORT_PATH="$RUNNER_TEMP/Zeroed-export"
          EXPORT_PLIST="$RUNNER_TEMP/ExportOptions.plist"
          APPLE_DEVELOPMENT_TEAM="$APPLE_DEVELOPMENT_TEAM" \
            PROVISIONING_PROFILE_SPECIFIER="$PROVISIONING_PROFILE_SPECIFIER" \
            IOS_BUNDLE_ID="$IOS_BUNDLE_ID" \
            bash scripts/ios-write-export-options.sh "$EXPORT_PLIST"

          # Scope Manual Distribution to the App target. xcodebuild
          # SETTING=value applies to every target in the workspace, so a
          # global PROVISIONING_PROFILE_SPECIFIER / CODE_SIGN_IDENTITY /
          # DEVELOPMENT_TEAM would be inherited by CocoaPods (which already
          # set CODE_SIGNING_ALLOWED=NO and org.cocoapods.* bundle ids).
          node scripts/ios-apply-app-signing.mjs \
            --team "$APPLE_DEVELOPMENT_TEAM" \
            --profile "$PROVISIONING_PROFILE_SPECIFIER"

          cd ios/App
          # Do not pass PRODUCT_BUNDLE_IDENTIFIER here — xcodebuild applies
          # it to every target, so Capacitor.framework / CapacitorCordova.framework
          # inherit app.zeroed.app and App Store rejects the IPA (ITMS-90685).
          # The App target already has PRODUCT_BUNDLE_IDENTIFIER in pbxproj.
          # Do not pass allowProvisioningUpdates — that mints a Development
          # cert on a fresh runner that has no private key to keep.
          COMMON=(
            -workspace App.xcworkspace
            -scheme App
            -configuration Release
            -destination 'generic/platform=iOS'
            MARKETING_VERSION="$APP_VERSION"
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER"
          )

          xcodebuild archive \
            "${COMMON[@]}" \
            -archivePath "$ARCHIVE_PATH"
          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportPath "$EXPORT_PATH" \
            -exportOptionsPlist "$EXPORT_PLIST"

          IPA=$(find "$EXPORT_PATH" -name '*.ipa' -print | head -1)
          if [ -z "$IPA" ]; then
            echo "::error::No IPA found under $EXPORT_PATH"
            ls -la "$EXPORT_PATH" || true
            exit 1
          fi
          echo "IPA_PATH=$IPA" >> "$GITHUB_ENV"
          echo "Archived $IPA"

      - name: Reject duplicate embedded bundle IDs
        run: node scripts/ios-check-ipa-bundle-ids.mjs "$IPA_PATH"

      - name: Upload to Internal TestFlight
        env:
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          echo "Uploading $IPA_PATH (v${APP_VERSION}, build ${BUILD_NUMBER}) to Internal TestFlight"
          xcrun altool --upload-app \
            --type ios \
            --file "$IPA_PATH" \
            --apiKey "$ASC_API_KEY_ID" \
            --apiIssuer "$ASC_API_ISSUER_ID"
          echo "Upload queued. Assign the build to an Internal Testing group in App Store Connect — do not submit for App Review."

      - name: Delete signing keychain and App Store Connect API key
        if: always()
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="${RUNNER_TEMP}/zeroed-signing.keychain-db"
          if [ -f "$KEYCHAIN_PATH" ]; then
            security delete-keychain "$KEYCHAIN_PATH" || true
          fi
          security default-keychain -d user -s login.keychain-db || true
          security list-keychains -d user -s login.keychain-db || true
          rm -f "$KEYCHAIN_PATH"
          rm -f "${RUNNER_TEMP}/zeroed-dist.p12"
          rm -f "${RUNNER_TEMP}/zeroed-appstore.mobileprovision"
          rm -f "${RUNNER_TEMP}/zeroed-profile.plist"
          rm -f "${{ runner.temp }}/zeroed-asc.p8"
          rm -f "${HOME}/.appstoreconnect/private_keys/AuthKey_"*.p8
          if [ -n "${IOS_PROFILE_UUID:-}" ]; then
            rm -f "${HOME}/Library/MobileDevice/Provisioning Profiles/${IOS_PROFILE_UUID}.mobileprovision"
          fi
          echo "Removed signing keychain, certificate, profile, and App Store Connect API key files."
