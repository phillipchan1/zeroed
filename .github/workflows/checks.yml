# The cheap gate: typecheck, the engine/lib conformance files, the MCP
# formatter check, and a structural check of the committed Capacitor iOS
# project (as far as Linux can go without Xcode).
#
# The TestFlight upload (ios-release.yml) runs on push to master and
# workflow_dispatch. It fails if the Distribution signing secrets are
# missing — see docs/ios-releases.md.
name: checks

on:
  push:
  pull_request:

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: zeroed_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d zeroed_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      ZEROED_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/zeroed_test
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: actionlint
        run: |
          set -euo pipefail
          version=1.7.12
          case "$(uname -m)" in
            x86_64)
              archive="actionlint_${version}_linux_amd64.tar.gz"
              sha256="8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
              ;;
            aarch64)
              archive="actionlint_${version}_linux_arm64.tar.gz"
              sha256="325e971b6ba9bfa504672e29be93c24981eeb1c07576d730e9f7c8805afff0c6"
              ;;
            *)
              echo "unsupported arch: $(uname -m)" >&2
              exit 1
              ;;
          esac
          curl -fsSL "https://github.com/rhysd/actionlint/releases/download/v${version}/${archive}" -o "/tmp/${archive}"
          echo "${sha256}  /tmp/${archive}" | sha256sum -c -
          tar -xzf "/tmp/${archive}" -C /tmp actionlint
          /tmp/actionlint -color
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npm run type-check
      - name: Lint
        run: npm run lint
      - name: Engine / lib / access checks
        run: npm run check
      - name: Client data gate
        run: npm run check:client-data-gate
      - name: MCP checks
        run: |
          npm --prefix mcp ci --no-audit --no-fund
          npm run mcp:check
      - name: Production web build
        run: npm run build
      - name: Capacitor iOS sync (no CocoaPods / Xcode on Linux)
        run: npx cap sync ios
      - name: iOS project structure
        run: |
          node scripts/ios-project-check.mjs
          npm run ios:check:ipa

  isolation-mutation:
    name: isolation-mutation
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: zeroed_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d zeroed_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      ZEROED_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/zeroed_test
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Isolation mutation proof
        run: npm run check:isolation-mutation

  postgres:
    name: postgres
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: zeroed
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/zeroed
      ZEROED_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/zeroed
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Install PostgreSQL 17 client
        run: |
          sudo apt-get update
          if ! sudo DEBIAN_FRONTEND=noninteractive apt-get install -y postgresql-client-17; then
            sudo apt-get install -y postgresql-common
            sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y postgresql-client-17
          fi
          # ubuntu-latest also ships a 16 client at /usr/bin; put 17 first so
          # pg_dump/pg_restore match the postgres:17 service.
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"
          /usr/lib/postgresql/17/bin/pg_dump --version
      - name: Better Auth + owner isolation on Postgres
        run: |
          command -v pg_dump
          pg_dump --version
          npm run check:postgres

  migrate-pg:
    name: migrate-pg
    runs-on: ubuntu-latest
    services:
      pg-source:
        image: postgres:17
        env:
          POSTGRES_USER: src
          POSTGRES_PASSWORD: dummy
          POSTGRES_DB: srcdb
        ports:
          - 55418:5432
        options: >-
          --health-cmd "pg_isready -U src -d srcdb"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      pg-target:
        image: postgres:17
        env:
          POSTGRES_USER: dst
          POSTGRES_PASSWORD: dummy
          POSTGRES_DB: dstdb
        ports:
          - 55419:5432
        options: >-
          --health-cmd "pg_isready -U dst -d dstdb"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Install PostgreSQL client tools
        env:
          ZEROED_PG_SOURCE_URL: postgresql://src:dummy@127.0.0.1:55418/srcdb
        run: |
          set -euo pipefail

          # PGDG signing key: https://www.postgresql.org/media/keys/ACCC4CF8.asc
          # Fingerprint is pinned so a substituted key fails the job.
          KEY_URL='https://www.postgresql.org/media/keys/ACCC4CF8.asc'
          KEY_FINGERPRINT='B97B0AFCAA1A47F044F244A07FCC7D46ACCC4CF8'
          KEY_PATH='/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc'

          sudo DEBIAN_FRONTEND=noninteractive apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq curl ca-certificates gnupg

          curl -fsSL --retry 5 --retry-delay 2 "${KEY_URL}" -o /tmp/pgdg.asc
          GOT_FPR="$(gpg --batch --show-keys --with-colons /tmp/pgdg.asc | awk -F: '/^fpr:/ { print $10; exit }')"
          if [ "${GOT_FPR}" != "${KEY_FINGERPRINT}" ]; then
            echo "::error::PGDG apt key fingerprint mismatch (got ${GOT_FPR:-empty}, expected ${KEY_FINGERPRINT})"
            exit 1
          fi
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo install -m 0644 /tmp/pgdg.asc "${KEY_PATH}"
          rm -f /tmp/pgdg.asc

          # shellcheck source=/dev/null
          . /etc/os-release
          echo "deb [arch=$(dpkg --print-architecture) signed-by=${KEY_PATH}] https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null

          printf '%s\n' \
            'Package: postgresql-client-*' \
            'Pin: origin apt.postgresql.org' \
            'Pin-Priority: 1001' \
            | sudo tee /etc/apt/preferences.d/pgdg >/dev/null

          sudo DEBIAN_FRONTEND=noninteractive apt-get update -qq

          install_client() {
            local major="$1"
            if ! sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq "postgresql-client-${major}"; then
              echo "::error::Could not install postgresql-client-${major} from the PGDG apt repo (signed, pinned)."
              exit 1
            fi
            if [ ! -x "/usr/lib/postgresql/${major}/bin/pg_dump" ]; then
              echo "::error::postgresql-client-${major} installed but /usr/lib/postgresql/${major}/bin/pg_dump is missing."
              exit 1
            fi
          }

          MAJOR=17
          install_client "${MAJOR}"

          SOURCE_URL="${ZEROED_PG_SOURCE_URL:-}"
          if [ -n "${SOURCE_URL}" ]; then
            export PATH="/usr/lib/postgresql/${MAJOR}/bin:${PATH}"
            # Match libpqCleanEnv: inherited PG* must not redirect this URL-only probe.
            # PGPASSFILE=/dev/null; env -u PGSSLMODE, PGHOSTADDR, and the rest.
            unset_pg=()
            while IFS= read -r key; do
              unset_pg+=(-u "${key}")
            done < <(env | awk -F= '/^PG/ { print $1 }')
            if ! NUM="$(env "${unset_pg[@]}" -u PGSSLMODE -u PGHOSTADDR PGPASSFILE=/dev/null PGSERVICEFILE=/dev/null PGOPTIONS='-c default_transaction_read_only=on' psql -v ON_ERROR_STOP=1 -tA -d "${SOURCE_URL}" -c 'SHOW server_version_num' | tr -d '[:space:]')"; then
              echo "::error::Could not read source server_version_num; cannot pick a matching pg_dump."
              exit 1
            fi
            if ! [[ "${NUM}" =~ ^[0-9]{5,}$ ]]; then
              echo "::error::unparsable source server_version_num: ${NUM}"
              exit 1
            fi
            DETECTED=$((NUM / 10000))
            echo "Source server_version_num=${NUM} (Postgres ${DETECTED})"
            if [ "${DETECTED}" -ne "${MAJOR}" ]; then
              install_client "${DETECTED}"
              MAJOR="${DETECTED}"
            fi
          else
            echo "No source URL in this step; using postgresql-client-17."
          fi

          echo "/usr/lib/postgresql/${MAJOR}/bin" >> "${GITHUB_PATH}"
          "/usr/lib/postgresql/${MAJOR}/bin/pg_dump" --version
          "/usr/lib/postgresql/${MAJOR}/bin/psql" --version
      - name: Map Neon-style aliases to the service containers
        run: |
          set -euo pipefail
          echo "127.0.0.1 ep-src.neon.tech ep-dst.neon.tech" | sudo tee -a /etc/hosts
      - name: Live two-Postgres migrate guards
        env:
          ZEROED_REQUIRE_PG: "1"
          ZEROED_PG_SOURCE_URL: postgresql://src:dummy@127.0.0.1:55418/srcdb
          ZEROED_PG_TARGET_URL: postgresql://dst:dummy@ep-dst.neon.tech:55419/dstdb
          ZEROED_PG_ALIAS_URL: postgresql://src:dummy@ep-src.neon.tech:55418/srcdb
          ZEROED_CHECK_PSQL_URL: postgresql://src:dummy@127.0.0.1:55418/srcdb
        run: node --experimental-strip-types scripts/migrate-supabase-to-neon.check.mjs

  migrate-tls:
    name: migrate-tls
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Install PostgreSQL client tools
        run: |
          set -euo pipefail
          sudo DEBIAN_FRONTEND=noninteractive apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq postgresql-client
          command -v psql
          command -v pg_dump
      - name: Prove source pg TLS verification
        env:
          ZEROED_REQUIRE_TLS: "1"
        run: node --experimental-strip-types scripts/migrate-supabase-to-neon.tls.check.mjs
