# The cheap gate: typecheck, the engine/lib conformance files, the MCP
# formatter check, and a structural check of the committed Capacitor iOS
# project (as far as Linux can go without Xcode).
#
# The TestFlight upload (ios-release.yml) runs on push to master and
# workflow_dispatch. It skips green when Apple secrets are missing —
# see docs/ios-releases.md.
name: checks

on:
  push:
  pull_request:

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: zeroed_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d zeroed_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      ZEROED_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/zeroed_test
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: actionlint
        run: |
          set -euo pipefail
          version=1.7.12
          case "$(uname -m)" in
            x86_64)
              archive="actionlint_${version}_linux_amd64.tar.gz"
              sha256="8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
              ;;
            aarch64)
              archive="actionlint_${version}_linux_arm64.tar.gz"
              sha256="325e971b6ba9bfa504672e29be93c24981eeb1c07576d730e9f7c8805afff0c6"
              ;;
            *)
              echo "unsupported arch: $(uname -m)" >&2
              exit 1
              ;;
          esac
          curl -fsSL "https://github.com/rhysd/actionlint/releases/download/v${version}/${archive}" -o "/tmp/${archive}"
          echo "${sha256}  /tmp/${archive}" | sha256sum -c -
          tar -xzf "/tmp/${archive}" -C /tmp actionlint
          /tmp/actionlint -color
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npm run type-check
      - name: Lint
        run: npm run lint
      - name: Engine / lib / access checks
        run: npm run check
      - name: Client data gate
        run: npm run check:client-data-gate
      - name: MCP checks
        run: |
          npm --prefix mcp ci --no-audit --no-fund
          npm run mcp:check
      - name: Production web build
        run: npm run build
      - name: Capacitor iOS sync (no CocoaPods / Xcode on Linux)
        run: npx cap sync ios
      - name: iOS project structure
        run: |
          node scripts/ios-project-check.mjs
          npm run ios:check:ipa

  isolation-mutation:
    name: isolation-mutation
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: zeroed_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d zeroed_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      ZEROED_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/zeroed_test
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Isolation mutation proof
        run: npm run check:isolation-mutation

  postgres:
    name: postgres
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: zeroed
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/zeroed
      ZEROED_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/zeroed
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Install PostgreSQL 17 client
        run: |
          sudo apt-get update
          if ! sudo DEBIAN_FRONTEND=noninteractive apt-get install -y postgresql-client-17; then
            sudo apt-get install -y postgresql-common
            sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y postgresql-client-17
          fi
          # ubuntu-latest also ships a 16 client at /usr/bin; put 17 first so
          # pg_dump/pg_restore match the postgres:17 service.
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"
          /usr/lib/postgresql/17/bin/pg_dump --version
      - name: Better Auth + owner isolation on Postgres
        run: |
          command -v pg_dump
          pg_dump --version
          npm run check:postgres
